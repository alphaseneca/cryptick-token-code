<!DOCTYPE html>
<html>
<head>
  <title>TOTP Device Configuration</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #007cba; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
    .account { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
    .time-sync { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <div class='container'>
    <h1>TOTP Device Configuration</h1>
    <div class='time-sync'>
      <h3>Time Synchronization</h3>
      <p>Current browser time: <span id='browserTime'>Loading...</span></p>
      <button onclick='syncTime()'>Sync Device Time with Browser</button>
      <div id='timeStatus'></div>
    </div>
    <h2>Add New Account</h2>
    <form id='addForm'>
      <div class='form-group'><label>Account Name:</label><input type='text' id='name' required></div>
      <div class='form-group'><label>Issuer:</label><input type='text' id='issuer' required></div>
      <div class='form-group'><label>Secret Key (Base32):</label><input type='text' id='secret' required></div>
      <div class='form-group'><label>Digits:</label><select id='digits'><option value='6'>6</option><option value='8'>8</option></select></div>
      <div class='form-group'><label>Algorithm:</label><select id='algorithm'><option value='SHA1'>SHA1</option></select></div>
      <button type='submit'>Add Account</button>
    </form>
    <h2>Current Accounts</h2>
    <div id='accounts'></div>
  </div>
  <script>
    function updateBrowserTime() { 
      const now = new Date(); 
      const timeString = now.toLocaleString(); 
      document.getElementById('browserTime').textContent = timeString; 
    }
    
    function syncTime() { 
      const now = new Date(); 
      const timestamp = Math.floor(now.getTime() / 1000); 
      const statusDiv = document.getElementById('timeStatus'); 
      statusDiv.innerHTML = '<div class="status">Syncing time...</div>'; 
      fetch('/settime', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/x-www-form-urlencoded'}, 
        body: 'timestamp=' + timestamp 
      })
      .then(response => response.text())
      .then(data => { 
        statusDiv.innerHTML = '<div class="status success">Time synchronized successfully!</div>'; 
        setTimeout(() => { statusDiv.innerHTML = ''; }, 3000); 
      })
      .catch(error => { 
        statusDiv.innerHTML = '<div class="status error">Failed to sync time: ' + error + '</div>'; 
      }); 
    }
    
    function loadAccounts() { 
      fetch('/list')
      .then(response => response.json())
      .then(data => { 
        const accountsDiv = document.getElementById('accounts'); 
        accountsDiv.innerHTML = ''; 
        if (data.accounts && data.accounts.length > 0) { 
          data.accounts.forEach((account, index) => { 
            const accountDiv = document.createElement('div'); 
            accountDiv.className = 'account'; 
            accountDiv.innerHTML = `<strong>${account.name}</strong> (${account.issuer})<br>Digits: ${account.digits}, Algorithm: ${account.algorithm}<br><button onclick='deleteAccount(${index})'>Delete</button>`; 
            accountsDiv.appendChild(accountDiv); 
          }); 
        } else { 
          accountsDiv.innerHTML = '<p>No accounts configured yet.</p>'; 
        } 
      })
      .catch(error => { 
        console.error('Error loading accounts:', error); 
        document.getElementById('accounts').innerHTML = '<p>Error loading accounts.</p>'; 
      }); 
    }
    
    function deleteAccount(index) { 
      fetch('/delete', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({index: index}) 
      })
      .then(response => response.json())
      .then(data => { 
        if(data.status === 'success') { 
          loadAccounts(); 
        } 
      }); 
    }
    
    document.getElementById('addForm').addEventListener('submit', function(e) { 
      e.preventDefault(); 
      const formData = { 
        name: document.getElementById('name').value, 
        issuer: document.getElementById('issuer').value, 
        secret: document.getElementById('secret').value, 
        digits: parseInt(document.getElementById('digits').value), 
        algorithm: document.getElementById('algorithm').value 
      }; 
      fetch('/add', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify(formData) 
      })
      .then(response => response.json())
      .then(data => { 
        if(data.status === 'success') { 
          document.getElementById('addForm').reset(); 
          loadAccounts(); 
        } 
      }); 
    });
    
    window.addEventListener('load', function() { 
      updateBrowserTime(); 
      setInterval(updateBrowserTime, 1000); 
      loadAccounts(); 
      setTimeout(syncTime, 2000); 
    });
  </script>
</body>
</html>
