[platformio]
default_envs = esp32-s3-n16r8
src_dir = src
include_dir = include

; Cryptick Token PCB v0.1.0 — ESP32-S3-WROOM-1 N16R8 only

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
monitor_speed = 115200

build_unflags =
	-DARDUINO_USB_MODE=1

build_src_filter =
	+<main.cpp>
	+<systems/>
	+<host/>
	+<../core/totp.cpp>
	+<../core/crypto_esp32.cpp>
	+<../core/fido2/>
	-<../core/fido2/test_power.c>
	-<../core/fido2/stubs.c>
	+<../drivers/fingerprint_r558s.cpp>
	+<../drivers/usb_device.cpp>

build_flags =
	-DUSE_LITTLEFS
	-DVTABLES_IN_FLASH
	-I include
	-I hal
	-I core
	-I core/fido2
	-I core/fido2/extensions
	-I drivers
	-I src
	-I src/systems
	-I src/host
	-I lib/tinycbor/src
	-DSOLO
	; LOADKEY / experimental master-key inject not shipping — keep Solo_EXPERIMENTAL off
	-D"APP_CONFIG=\"config.h\""
	-DDEBUG_LEVEL=1
	-DCORE_DEBUG_LEVEL=0
	; USB: MODE=0 TinyUSB product stack; VID/PID set at runtime in usb_device_init
	; Do not -DCFG_TUD_CDC (Adafruit port sets 2; product registers one CDC interface)
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-DUSE_TINYUSB
	-DESP32
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-D USB_MANUFACTURER='"Ucaselabs"'
	-D USB_PRODUCT='"Cryptick Token"'
	-Wl,--wrap=TinyUSB_Port_EnterDFU

; Archive Adafruit TinyUSB so ESP32 core's libarduino_tinyusb supplies stack
; symbols (lib_archive=no pulls Adafruit tusb.c.o → multiple definitions).
lib_archive = yes
lib_deps =
	olikraus/U8g2@^2.35.19
	adafruit/RTClib@^2.1.4
	bblanchon/ArduinoJson@^6.21.3
	; 3.3.x avoided dual-stack link tears with arduino-esp32 2.x (see Adafruit #473)
	adafruit/Adafruit TinyUSB Library@3.3.4
	kmackay/micro-ecc@^1.0.0
lib_ignore =
	Adafruit NeoPixel
	SdFat - Adafruit Fork
	MIDI USB
	MIDI Library
	Adafruit SPIFlash
lib_ldf_mode = chain+

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram = enabled
board_build.partitions = default_16MB.csv

; esptool only: DTR/RTS enter download, hard_reset leave download. One pair.
; PlatformIO option use_1200bps_touch is the CDC soft-reboots-as-download trick —
; it is NOT needed with a CH340 UART0 adapter and it spams extra resets / wedges Windows.
upload_protocol = esptool
upload_speed = 460800
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.require_upload_port = no
upload_flags =
	--before=default_reset
	--after=hard_reset


; ---------- lightweight Unity suites (USB Serial/JTAG = MODE=1 so tests print) ----------
; Shared: disable LTO — bitcode objects lose symbols when unity tests link sparsely.
[test_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
test_build_project_src = true
build_unflags =
	-DARDUINO_USB_MODE=1
	-flto
	-flto=auto
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-fno-lto
lib_deps =
monitor_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
upload_flags =
	--before=default_reset
	--after=hard_reset

[env:test_totp]
extends = test_base
test_filter = test_totp
build_flags =
	${test_base.build_flags}
	-I core
	-I include
build_src_filter =
	-<**/*>
	+<../core/totp.cpp>

[env:test_event_bus]
extends = test_base
test_filter = test_event_bus
build_flags =
	${test_base.build_flags}
	-I src/systems
	-I include
build_src_filter =
	-<**/*>
	+<systems/event_bus.cpp>

[env:test_fp_enroll]
extends = test_base
test_filter = test_fp_enroll
build_flags =
	${test_base.build_flags}
	-I drivers
	-I include
	-I core
build_src_filter =
	-<**/*>
	+<../drivers/fingerprint_r558s.cpp>
