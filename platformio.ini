[platformio]
default_envs = esp32-s3-supermini

[env]
framework = arduino
monitor_speed = 115200

lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.15
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/RTClib@^2.1.4
	bblanchon/ArduinoJson@^6.21.3
	adafruit/Adafruit TinyUSB Library@^3.4.1
	kmackay/micro-ecc@^1.0.0

build_src_filter = 
	+<*> 
	+<../core/totp.cpp> 
	+<../core/crypto_esp32.cpp>
	+<../core/fido2/*> 
	+<../drivers/*>

build_flags = 
	-DUSE_LITTLEFS
	-DCORE_DEBUG_LEVEL=0
	-DVTABLES_IN_FLASH
	-I lib/tinycbor/src
	-I core/fido2
	-I core/fido2/extensions
	-DSOLO
	-DSOLO_EXPERIMENTAL
	-DENABLE_U2F
	-DENABLE_CTAP2
	-D"APP_CONFIG=\"config.h\""
	-DDEBUG_LEVEL=1
	-DCORE_DEBUG_LEVEL=5

test_framework = unity

; =========================
; 🚀 ESP32-S3 Super Mini (MAIN)
; =========================
[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

upload_speed = 921600
monitor_speed = 115200

; ⚠️ Super Mini specifics
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.psram = disabled
board_build.partitions = huge_app.csv

build_flags = 
	${env.build_flags}
	-DESP32
	-DESP32S3
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-D USB_VID=0x1209
	-D USB_PID=0xBEEE
	-D USB_MANUFACTURER='"SoloKeys"'
	-D USB_PRODUCT='"Cryptick-Token"'



; =========================
; ✅ ESP8266 Production
; =========================
[env:hw364a]
platform = espressif8266
board = esp12e
upload_speed = 460800

build_flags = 
	${env.build_flags}
	-DNONOSDK_190703=1
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

; =========================
; 🛠 Debug (ESP8266)
; =========================
[env:debug]
platform = espressif8266
board = esp12e

build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=5

monitor_filters = esp8266_exception_decoder