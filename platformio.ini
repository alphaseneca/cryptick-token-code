; PlatformIO Project Configuration File
; TOTP Hardware Device - ESP8266

[platformio]
default_envs = hw364a

[env]
; Common settings for all environments
platform = espressif8266
framework = arduino
monitor_speed = 57600
upload_speed = 460800

; Common libraries
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.15
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/RTClib@^2.1.4
	bblanchon/ArduinoJson@^6.21.3
	lucadentella/TOTP library@^1.1.0
	; Use local lib/EspSoftwareSerial (5.0.0 compatible) - plerup 6.x fails on ESP8266

; Common build flags
build_flags = 
	-DUSE_LITTLEFS
	-DCORE_DEBUG_LEVEL=0
	-DVTABLES_IN_FLASH
	; -DENABLE_WEBSERVER  ; Uncomment to enable web server functionality

[env:hw364a]
; Production environment - optimized for your hardware
board = esp12e
build_flags = 
	${env.build_flags}
	-DNONOSDK_190703=1
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

[env:debug]
; Debug environment - for development
board = esp12e
build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=5
monitor_filters = esp8266_exception_decoder