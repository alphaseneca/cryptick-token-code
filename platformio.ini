; Cryptick Token PCB v0.1.0 — ESP32-S3-WROOM-1 N16R8
;
; Environments:
;   esp32-s3-n16r8          product (default) — TinyUSB CDC+HID, verbose log
;   esp32-s3-n16r8-ship     product, quiet console (DEBUG_LEVEL=0)
;   esp32-s3-n16r8-install  first load / recovery over USB Serial-JTAG
;   esp32-s3-n16r8-jtag     lab fallback — Serial/JTAG logs, no FIDO HID
;   test_*                  L1 Unity suites, see [test_base]
[platformio]
default_envs = esp32-s3-n16r8
src_dir = src
include_dir = include

; ---------------------------------------------------------------------------
; Shared fragments. Interpolated by the envs below so the layer roots and the
; product USB identity are declared exactly once.
; ---------------------------------------------------------------------------
[cryptick]
includes =
	-I include
	-I core
	-I core/fido2
	-I core/fido2/extensions
	-I core/ble_fido
	-I core/piv
	-I drivers
	-I src
	-I src/systems
	-I src/host
	-I lib/tinycbor/src

; TinyUSB owns the port: Arduino's own CDC/MSC/DFU must stay off.
usb_product =
	-DCRYPTICK_USB_STACK=1
	-DCRYPTICK_CONSOLE_UART=0
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-D USB_MANUFACTURER='"Ucaselabs"'
	-D USB_PRODUCT='"Cryptick Token"'

; Lab fallback: the ROM USB Serial/JTAG bridge under Espressif's VID 303A.
; MODE=1 must be paired with CDC_ON_BOOT=1 — that is what makes `Serial` the
; HWCDC JTAG class. With CDC_ON_BOOT=0 it stays UART0 HardwareSerial, which
; has no setTxTimeoutMs() and fails to compile.
usb_jtag =
	-DCRYPTICK_USB_STACK=1
	-DCRYPTICK_CONSOLE_UART=0
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-D USB_MANUFACTURER='"Ucaselabs"'
	-D USB_PRODUCT='"Cryptick Token"'

; FIDO BLE transport (GATT 0xFFFD). USB and BLE are both product transports,
; so both producers are live and the FIDO task arbitrates between them.
ble =
	-DCRYPTICK_BLE_FIDO=1
	-DCRYPTICK_BLE_PIV=1

; USB CCID transport for the PIV applet. Behind its own flag because it adds an
; interface to a composite that already enumerates, which is the one change on
; this device that can cost the reflash path. usb_ccid.cpp latches the
; interface off after two boots that never reach the configured state.
ccid =
	-DCRYPTICK_USB_CCID=1

soc =
	-DESP32
	-DESP32S3
	-DBOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
; Product USB (default): TinyUSB CDC logs + FIDO HID
;   VID 0x1209  PID 0xBEEE  "Cryptick Token"
; Host console: /dev/cu.usbmodem* @ 115200
; Reflash: 1200bps touch | type BOOTLOADER | HID ENTERBOOT | CH340 UART
; ---------------------------------------------------------------------------
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
monitor_speed = 115200

; Board JSON forces MODE=1 — strip and use product OTG/TinyUSB
build_unflags =
	-DARDUINO_USB_MODE=1

build_src_filter =
	+<main.cpp>
	+<systems/>
	+<host/>
	+<../core/totp.cpp>
	+<../core/crypto_esp32.cpp>
	+<../core/secret_crypto.cpp>
	+<../core/cryptick_log.cpp>
	+<../core/fido2/>
	-<../core/fido2/test_power.c>
	-<../core/fido2/stubs.c>
	+<../core/ble_fido/>
	+<../core/piv/>
	+<../drivers/fingerprint_r558s.cpp>
	+<../drivers/usb_device.cpp>
	+<../drivers/ccid_proto.c>
	+<../drivers/ccid_descriptors.c>
	+<../drivers/usb_ccid.cpp>

build_flags =
	-DUSE_LITTLEFS
	-DVTABLES_IN_FLASH
	${cryptick.includes}
	-DSOLO
	-D"APP_CONFIG=\"config.h\""
	-DDEBUG_LEVEL=1
	-DCRYPTICK_LOG_LEVEL_DEFAULT=4
	-DCORE_DEBUG_LEVEL=0
	${cryptick.usb_product}
	${cryptick.soc}
	${cryptick.ble}
	${cryptick.ccid}

lib_deps =
	olikraus/U8g2@^2.35.19
	adafruit/RTClib@^2.1.4
	bblanchon/ArduinoJson@^6.21.3
	kmackay/micro-ecc@^1.0.0
	h2zero/NimBLE-Arduino@^2.2.3
lib_ldf_mode = chain+

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram = enabled
board_build.partitions = default_16MB.csv
; USB IDs must live in pins_arduino (USB.begin runs in app_main before setup)
board_build.variants_dir = variants
board_build.variant = cryptick_s3

; TinyUSB product (running 1209:BEEE): host 1200bps → ROM, then flash
upload_protocol = esptool
upload_speed = 460800
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.require_upload_port = false
upload_flags =
	--after=hard_reset

; ---------------------------------------------------------------------------
; Shipping binary: quiet console. Runtime LOGLEVEL can still raise volume for
; product CLOG_*; Solo printf1 macros are compiled out (DEBUG_LEVEL=0).
; Do not inherit parent build_flags for level macros (avoids dual -D).
; ---------------------------------------------------------------------------
[env:esp32-s3-n16r8-ship]
extends = env:esp32-s3-n16r8
build_unflags =
	${env:esp32-s3-n16r8.build_unflags}
	-DDEBUG_LEVEL=1
	-DCRYPTICK_LOG_LEVEL_DEFAULT=4
build_flags =
	-DUSE_LITTLEFS
	-DVTABLES_IN_FLASH
	${cryptick.includes}
	-DSOLO
	-D"APP_CONFIG=\"config.h\""
	-DDEBUG_LEVEL=0
	-DCRYPTICK_LOG_LEVEL_DEFAULT=1
	-DCORE_DEBUG_LEVEL=0
	${cryptick.usb_product}
	${cryptick.soc}
	${cryptick.ble}
	${cryptick.ccid}

; ---------------------------------------------------------------------------
; First load / recovery: flash product MODE=0 binary via USB Serial/JTAG (303A)
; Use when device is still JTAG lab build, stuck ROM, or CDC does not 1200-touch.
; After success: host should re-enumerate as VID 1209 / PID BEEE (+ HID).
; ---------------------------------------------------------------------------
[env:esp32-s3-n16r8-install]
extends = env:esp32-s3-n16r8
extra_scripts =
	pre:scripts/pio_no_1200_touch.py
board_upload.use_1200bps_touch = 0
board_upload.wait_for_upload_port = 0
board_upload.require_upload_port = 0
upload_flags =
	--before=usb_reset
	--after=hard_reset

; ---------------------------------------------------------------------------
; Lab fallback: USB Serial/JTAG (VID 303A) — logs only, no FIDO HID
; Use if product TinyUSB does not enumerate; then install product again.
; ---------------------------------------------------------------------------
[env:esp32-s3-n16r8-jtag]
extends = env:esp32-s3-n16r8
; Do not inherit the parent flags here: the product USB identity has to be
; replaced wholesale, not overridden with a second contradictory -D.
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DUSE_LITTLEFS
	-DVTABLES_IN_FLASH
	${cryptick.includes}
	-DSOLO
	-D"APP_CONFIG=\"config.h\""
	-DDEBUG_LEVEL=1
	-DCRYPTICK_LOG_LEVEL_DEFAULT=4
	-DCORE_DEBUG_LEVEL=0
	${cryptick.usb_jtag}
	${cryptick.soc}
	${cryptick.ble}
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
upload_flags =
	--before=usb_reset
	--after=hard_reset

; ---------------------------------------------------------------------------
; L1 Unity suites (run on the board: `pio test -e <env>`)
;
; Every suite runs against the real product sources, so each one links the
; console backend (`cryptick_log` + `usb_device`). Under MODE=1 without
; CRYPTICK_USB_STACK the USB driver collapses to a thin Serial wrapper, which
; keeps the suites small while still exercising the shipped CLOG_* call sites.
;
; Add new suites by extending test_base and appending to the inherited
; build_src_filter — never by re-listing the console backend by hand.
; ---------------------------------------------------------------------------
[test_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
test_build_project_src = true
build_unflags =
	-DARDUINO_USB_MODE=1
	-flto
	-flto=auto
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-fno-lto
	-DCRYPTICK_CONSOLE_UART=0
	-I include
	-I core
	-I drivers
	-I src
	-I src/systems
	-I src/host
build_src_filter =
	-<**/*>
	+<../core/cryptick_log.cpp>
	+<../drivers/usb_device.cpp>
lib_deps =
monitor_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
upload_flags =
	--before=default_reset
	--after=hard_reset

[env:test_totp]
extends = test_base
test_filter = test_totp
build_src_filter =
	${test_base.build_src_filter}
	+<../core/totp.cpp>

[env:test_event_bus]
extends = test_base
test_filter = test_event_bus
build_src_filter =
	${test_base.build_src_filter}
	+<systems/event_bus.cpp>

[env:test_fp_enroll]
extends = test_base
test_filter = test_fp_enroll
build_src_filter =
	${test_base.build_src_filter}
	+<../drivers/fingerprint_r558s.cpp>

[env:test_nav]
extends = test_base
test_filter = test_nav
build_flags =
	${test_base.build_flags}
	-I core/fido2
build_src_filter =
	${test_base.build_src_filter}
	+<systems/event_bus.cpp>
	+<systems/nav_system.cpp>
	+<systems/auth_system.cpp>

; AES-GCM wrap key + secret blob unit tests (mbedtls on device / host)
[env:test_secret_crypto]
extends = test_base
test_filter = test_secret_crypto
build_src_filter =
	${test_base.build_src_filter}
	+<../core/secret_crypto.cpp>
